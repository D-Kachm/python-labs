name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality-and-build:
    name: Lint, Test, Package & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff lint check
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Type check (MyPy)
        run: |
          mypy src tests benchmarks scripts

      - name: Run test suite with branch coverage
        run: |
          pytest -v --cov=car_catalog --cov-branch --cov-fail-under=80 --cov-report=term-missing

      - name: Build distribution packages (wheel and sdist)
        run: |
          python -m build

      - name: Verify package artifacts
        run: |
          ls -la dist/

      - name: Build Docker image
        run: |
          docker build -t car-catalog:ci .

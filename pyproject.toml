[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "1.0.0"
description = "Production-oriented Vehicle Inventory & Analytics System - Final Release"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Denys Kachmar", email = "Denys.Kachmar@lnu.edu.ua"},
]
license = "MIT"
dependencies = [
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.5.0",
    "build>=1.2.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "build",
    "dist",
    "docs",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "integration: integration tests",
    "unit: unit tests",
    "asyncio: asynchronous tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = [
    "car_catalog",
]
omit = [
    "*/main.py",
    "*/benchmark.py",
    "*/logging_config.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
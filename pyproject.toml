[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.6.0"
description = "Laboratory project for Professional Python - Lab 6 (Automated Testing with pytest & Coverage)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "integration: integration tests",
    "unit: unit tests",
    "asyncio: asynchronous tests",
]

[tool.coverage.run]
branch = true
source = [
    "car_catalog",
]
omit = [
    "*/main.py",
    "*/benchmark.py",
    "*/logging_config.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
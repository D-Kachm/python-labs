[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.4.0"
description = "Laboratory project for Professional Python - Lab 4 (Professional OOP & Type System)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "mypy>=1.9.0",
]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
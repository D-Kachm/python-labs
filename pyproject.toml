[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.5.0"
description = "Laboratory project for Professional Python - Lab 5 (Reliable I/O, Error Handling & Serialization)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9.0",
]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true